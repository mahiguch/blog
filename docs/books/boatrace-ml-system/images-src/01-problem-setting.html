<!doctype html>
<!-- size: 800x540 -->
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B4C9B"/>
    </marker>
  </defs>

  <!-- 左: 締切前に使える情報 -->
  <rect x="24" y="40" width="230" height="240" rx="8" class="box"/>
  <text x="139" y="68" text-anchor="middle" class="title navy">締切前に使える情報</text>
  <rect x="40" y="86" width="198" height="82" rx="6" class="box-white"/>
  <text x="139" y="108" text-anchor="middle" class="h">出走表</text>
  <text x="139" y="130" text-anchor="middle" class="small muted">選手の級別・全国/当地勝率</text>
  <text x="139" y="150" text-anchor="middle" class="small muted">モーター 2 連率・全国平均 ST</text>
  <rect x="40" y="180" width="198" height="86" rx="6" class="box-white"/>
  <text x="139" y="202" text-anchor="middle" class="h">直前情報(締切の約 10 分前)</text>
  <text x="139" y="224" text-anchor="middle" class="small muted">進入コースとスタート展示</text>
  <text x="139" y="244" text-anchor="middle" class="small muted">展示タイム・気象</text>

  <!-- 矢印 -->
  <line x1="258" y1="160" x2="312" y2="160" class="line" marker-end="url(#arr)"/>

  <!-- 中央: 予測モデル -->
  <rect x="316" y="110" width="150" height="100" rx="8" fill="#2B4C9B"/>
  <text x="391" y="152" text-anchor="middle" class="title" fill="#fff">予測モデル</text>
  <text x="391" y="178" text-anchor="middle" class="small" fill="#fff">120 クラス分類</text>

  <line x1="470" y1="160" x2="524" y2="160" class="line" marker-end="url(#arr)"/>

  <!-- 右: 120 通りの確率分布 -->
  <rect x="528" y="40" width="248" height="240" rx="8" class="box"/>
  <text x="652" y="68" text-anchor="middle" class="title navy">3 連単 120 通りの確率分布</text>
  <g id="bars"></g>
  <line x1="548" y1="236" x2="762" y2="236" stroke="#6B7280" stroke-width="1"/>
  <text x="548" y="256" class="small muted">1-2-3</text>
  <text x="655" y="256" text-anchor="middle" class="small muted">… 120 通り …</text>
  <text x="762" y="256" text-anchor="end" class="small muted">6-5-4</text>
  <text x="652" y="275" text-anchor="middle" class="small muted">Σ = 1、正解は 1 つだけ</text>

  <!-- 時間軸 -->
  <line x1="40" y1="400" x2="770" y2="400" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
  <text x="770" y="424" text-anchor="end" class="small muted">時間</text>

  <!-- 目盛り: 朝 / 直前 / 締切 / 本番 -->
  <line x1="120" y1="392" x2="120" y2="408" stroke="#111827" stroke-width="2"/>
  <text x="120" y="378" text-anchor="middle" class="h">朝</text>
  <text x="120" y="428" text-anchor="middle" class="small">出走表</text>

  <line x1="340" y1="392" x2="340" y2="408" stroke="#111827" stroke-width="2"/>
  <text x="340" y="378" text-anchor="middle" class="h">締切 約 10 分前</text>
  <text x="340" y="428" text-anchor="middle" class="small">直前情報</text>

  <!-- 締切線 -->
  <line x1="470" y1="310" x2="470" y2="470" class="line-red dash"/>
  <rect x="424" y="308" width="92" height="26" rx="13" fill="#E5002D"/>
  <text x="470" y="326" text-anchor="middle" fill="#fff" class="h">締切</text>

  <!-- 使えない情報 -->
  <rect x="500" y="356" width="270" height="30" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-dasharray="5 3"/>
  <text x="635" y="376" text-anchor="middle" class="muted">本番 ST・決まり手・着順(使えない)</text>
  <text x="530" y="428" class="small muted">レース後にしか分からない</text>

  <!-- 使ってよい範囲の帯 -->
  <rect x="60" y="446" width="400" height="24" rx="4" fill="#EEF2FF" stroke="#2B4C9B"/>
  <text x="260" y="463" text-anchor="middle" class="small navy">この範囲の情報だけで 120 通りの確率を推定する</text>
  <rect x="480" y="446" width="290" height="24" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-dasharray="5 3"/>
  <text x="625" y="463" text-anchor="middle" class="small muted">特徴量に混ぜるとリーク(第 3 章・第 19 章)</text>
</svg>
<script>
  // 120 本のうち 36 本を模式的に描く(減衰する分布)
  const g = document.getElementById('bars');
  const n = 36, x0 = 550, w = 5.3, base = 236, maxH = 140;
  for (let i = 0; i < n; i++) {
    const h = maxH * Math.exp(-i / 6) + 3;
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', x0 + i * (w + 0.6));
    r.setAttribute('y', base - h);
    r.setAttribute('width', w);
    r.setAttribute('height', h);
    r.setAttribute('fill', i === 0 ? '#E5002D' : '#2B4C9B');
    g.appendChild(r);
  }
</script>
</body></html>
