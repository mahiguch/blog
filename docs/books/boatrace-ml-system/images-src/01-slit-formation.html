<!doctype html>
<!-- size: 800x470 -->
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470">
  <g id="panels"></g>
  <text x="24" y="452" class="small muted">上から見た図。艇は左から右へ進み、舳先(へさき)がスタートラインを通過した時刻が ST。艇色は 1 白 2 黒 3 赤 4 青 5 黄 6 緑</text>
</svg>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const g = document.getElementById('panels');
  const colors = {1:['#fff','#000'],2:['#000','#fff'],3:['#E5002D','#fff'],4:['#0047AB','#fff'],5:['#FFD700','#000'],6:['#008000','#fff']};
  // 各パターンの舳先の位置(スタートラインからの遅れ px。0 = ライン上)
  const patterns = [
    {title:'横一線', sub:'全艇がほぼ同時に通過', note:'→ イン逃げ or 差し', off:[0,0,0,0,0,0]},
    {title:'内凹み', sub:'インがスタート遅れ、外が出る', note:'→ まくり or まくり差し', off:[34,24,10,0,0,0]},
    {title:'外凹み', sub:'アウトがスタート遅れ', note:'→ イン逃げ確率 UP', off:[0,0,0,10,24,34]},
  ];
  const el = (n, a, txt) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  patterns.forEach((p, i) => {
    const x0 = 24 + i * 256, w = 240, y0 = 20, h = 410;
    g.appendChild(el('rect', {x:x0, y:y0, width:w, height:h, rx:8, fill:'#F3F4F6'}));
    g.appendChild(el('text', {x:x0+w/2, y:y0+26, 'text-anchor':'middle', class:'title'}, p.title));
    g.appendChild(el('text', {x:x0+w/2, y:y0+48, 'text-anchor':'middle', class:'small'}, p.sub));
    g.appendChild(el('text', {x:x0+w/2, y:y0+68, 'text-anchor':'middle', class:'small navy'}, p.note));
    const lineX = x0 + 176;
    g.appendChild(el('line', {x1:lineX, y1:y0+82, x2:lineX, y2:y0+h-30, stroke:'#E5002D', 'stroke-width':3}));
    g.appendChild(el('text', {x:lineX, y:y0+h-12, 'text-anchor':'middle', class:'small red'}, 'スタートライン'));
    g.appendChild(el('text', {x:x0+14, y:y0+h-12, class:'small muted'}, '進行方向 →'));
    for (let b = 1; b <= 6; b++) {
      const y = y0 + 106 + (b - 1) * 48, bw = 76, bh = 26;
      const bow = lineX - p.off[b-1];   // 舳先の x
      const tail = bow - bw;
      g.appendChild(el('path', {d:`M ${tail} ${y-bh/2} L ${bow-22} ${y-bh/2} L ${bow} ${y} L ${bow-22} ${y+bh/2} L ${tail} ${y+bh/2} Z`, fill:colors[b][0], stroke:'#111827', 'stroke-width':2}));
      g.appendChild(el('text', {x:tail+24, y:y+5, 'text-anchor':'middle', fill:colors[b][1], class:'h'}, b));
      g.appendChild(el('text', {x:x0+12, y:y+5, class:'small muted'}, `${b} コース`));
    }
    g.appendChild(el('text', {x:x0+12, y:y0+92, class:'small muted'}, '内'));
    g.appendChild(el('text', {x:x0+12, y:y0+106+5*48+30, class:'small muted'}, '外'));
  });
</script>
</body></html>
