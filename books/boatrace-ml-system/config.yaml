title: "機械学習システムの設計と運用 ― ボートレース予想サイトの開発で学ぶデータ収集・モデル・評価・配信"
summary: |
  機械学習を含むシステムを設計し、評価し、運用し続ける方法を、ボートレース予想サイト boatrace-fun.net の開発を題材に解説する実践書です。
  公式サイトから収集した 1 レース 1 行の CSV を出発点に、偏差値化・ベイズ収縮・非負制約付き最小二乗による
  「強さポイント」を作り、回収率と log-loss で評価し、Cloud Run Jobs と Pub/Sub で 2 分毎に更新される
  静的サイトとして Astro で配信するまでを、実際のコードと実測値(2026 年 8 月時点)で解説します。
  v1 から v10 まで 10 の予想者を投入して 8 つを退役させた A/B 実験の記録、ST 推定・スリット展開・穴予想での
  「定説が測ると逆だった」発見、そして「できないことを証明して撤退する」設計書の書き方まで、
  機械学習をシステムとして運用するための一連の物語として読めます。
  Python と TypeScript / Astro の基礎知識を前提とします。
topics: ["python", "機械学習", "typescript", "astro", "googlecloud"]
